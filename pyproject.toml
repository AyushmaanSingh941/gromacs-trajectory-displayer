[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gromacs-trajectory-displayer"
version = "0.1.0"
authors = [
  { name="Ayushmaan Singh" },
]
description = "An open-source Streamlit platform for fast GROMACS trajectory parsing, statistical analysis, and interactive reporting."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.20",
    "scipy>=1.11",
    "kaleido>=0.2.1",
    "reportlab>=4.0"
]